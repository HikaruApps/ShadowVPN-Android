<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>ShadowVPN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app" data-state="disconnected">
    <header class="topbar">
      <div class="wordmark">SHADOW<span>VPN</span></div>
      <button class="round-button" id="menuButton" aria-label="Меню">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.35"/><circle cx="12" cy="12" r="1.35"/><circle cx="12" cy="19" r="1.35"/></svg>
      </button>
      <div class="app-menu" id="appMenu" hidden>
        <button data-panel="logs"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 9l2 2-2 2M12 14h4"/></svg></span><span><b>Логи</b><small>Диагностика Xray и TUN</small></span></button>
        <button id="refreshButton"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M18.5 9A7 7 0 0 0 6 6.5L4 9m16 6-2 2.5A7 7 0 0 1 5.5 15"/></svg></span><span><b>Синхронизировать</b><small>Обновить серверы из API</small></span></button>
        <button data-panel="settings"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM4 12H2m20 0h-2M12 4V2m0 20v-2M6.3 6.3 4.9 4.9m14.2 14.2-1.4-1.4m0-11.4 1.4-1.4M4.9 19.1l1.4-1.4"/></svg></span><span><b>Настройки</b><small>DNS и параметры подключения</small></span></button>
        <button data-panel="subscriptions"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6zM9 9h10v10H9"/></svg></span><span><b>Подписки</b><small>Источники списка серверов</small></span></button>
      </div>
    </header>

    <main class="connect-stage">
      <section class="subscription-quota" id="subscriptionQuota" hidden>
        <div class="quota-copy"><span id="quotaTitle">Лимит подписки</span><b id="quotaValue"></b></div>
        <div class="quota-track"><i id="quotaProgress"></i></div>
        <small id="quotaExpire"></small>
      </section>
      <button class="power-orb" id="powerButton" aria-label="Подключить VPN">
        <svg class="power-icon" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.5 6.5a7 7 0 1 0 11 0"/></svg>
      </button>
      <section class="connection-copy">
        <div class="connect-status" id="statusText">Нажмите, чтобы подключиться</div>
        <div class="connected-location" id="connectedLocation" hidden></div>
        <div class="traffic-stats" id="trafficStats" hidden>
          <div class="traffic-metric">
            <svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.8 7.8 8 11l3.2-3.2M3 13.5h10"/></svg>
            <span><b id="downloadSpeed">0 Б/с</b><small id="downloadTotal">0 Б</small></span>
          </div>
          <i></i>
          <div class="traffic-metric">
            <svg viewBox="0 0 16 16"><path d="M8 13.5v-8M4.8 8.2 8 5l3.2 3.2M3 2.5h10"/></svg>
            <span><b id="uploadSpeed">0 Б/с</b><small id="uploadTotal">0 Б</small></span>
          </div>
        </div>
        <div class="connection-details" id="connectionDetails">
          <span class="connection-ip">
            <i class="privacy-dot"></i>
            <span class="ip-label" id="ipLabel">Ваш IP</span>
            <span class="ip-value" id="ipValue">Определяем…</span>
          </span>
          <i class="details-divider" id="detailsDivider" hidden></i>
          <span class="connection-duration" id="connectionDuration" hidden><span>Сеанс</span><b id="sessionTime">00:00:00</b></span>
        </div>
      </section>
    </main>

    <section class="bottom-dock" id="serverDock">
      <div class="grabber"></div>
      <button class="selected-server" id="selectedServerButton">
        <span class="server-flag large" id="dockFlag"></span>
        <span class="server-copy"><b id="dockName">Выберите сервер</b><small id="dockMeta">Потяните вверх, чтобы открыть список</small></span>
        <span class="dock-ping" id="dockPing"></span>
        <svg class="chevron" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <div class="dock-divider"></div>
      <nav class="dock-nav">
        <button class="active" aria-label="Главная"><svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
        <button data-panel="settings" aria-label="Настройки"><svg class="gear" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m9.4 3.5.6-1.5h4l.6 1.5 1.8.8 1.5-.6 2.8 2.8-.6 1.5.8 1.8 1.5.6v4l-1.5.6-.8 1.8.6 1.5-2.8 2.8-1.5-.6-1.8.8-.6 1.5h-4l-.6-1.5-1.8-.8-1.5.6-2.8-2.8.6-1.5-.8-1.8-1.5-.6v-4l1.5-.6.8-1.8-.6-1.5 2.8-2.8 1.5.6z"/></svg></button>
        <button data-panel="subscriptions" aria-label="Подписки"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button>
      </nav>
    </section>

    <div class="scrim" id="serverScrim" hidden></div>
    <section class="server-sheet" id="serverSheet" aria-hidden="true">
      <div class="sheet-grabber"></div>
      <header class="sheet-header" id="sheetHeader">
        <div><h1>Выбор сервера</h1><p id="serverCount">Все серверы</p></div>
        <div class="sheet-actions">
          <button id="sortButton" aria-label="Сортировка" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M8.5 6.5H19M8.5 12H16M8.5 17.5H13"/><path d="M5 5v14m0 0-2-2m2 2 2-2"/></svg></button>
          <button id="pingButton" aria-label="Проверить задержку"><svg class="speedometer-icon ping-gauge" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8.5 8.5 0 1 1 16 0" stroke-width="1.65"/><path d="m6.5 14.2-1.35-.55M8.7 11.4l-.9-1.15M12 10V8.5M15.3 11.4l.9-1.15M17.5 14.2l1.35-.55" stroke-width="1.35"/><path class="ping-gauge-needle" d="M12 17V11" stroke-width="1.9"/><circle cx="12" cy="17" r="1.35"/></svg></button>
          <button id="closeServers" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
        </div>
      </header>
      <div class="sort-menu" id="sortMenu" hidden role="menu" aria-label="Сортировка серверов">
        <button data-sort="name" role="menuitem"><span><b>По алфавиту</b><small>А–Я · A–Z</small></span><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></button>
        <button data-sort="original" role="menuitem"><span><b>Как в подписке</b><small>Исходный порядок</small></span><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></button>
        <button data-sort="latency" role="menuitem"><span><b>По задержке</b><small>Минимальный пинг</small></span><svg viewBox="0 0 24 24"><path d="m6 12 4 4 8-8"/></svg></button>
      </div>
      <div class="categories" id="categories">
        <button class="active" data-category="all">Все</button><button data-category="fast">Быстрые</button><button data-category="p2p">P2P</button><button data-category="gemini">Gemini</button><button data-category="warp">WARP</button><button data-category="no-tls">No TLS</button>
      </div>
      <div class="server-list" id="serverList"></div>
    </section>

    <div class="panel-overlay" id="panelOverlay" hidden>
      <section class="panel" id="panel">
        <div class="sheet-grabber"></div>
        <header class="panel-header"><button class="panel-back" id="panelBack" hidden><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button><div class="panel-heading"><h1 id="panelTitle">Настройки</h1><p id="panelSubtitle"></p></div><button id="closePanel"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header>
        <div class="panel-body" id="panelBody"></div>
      </section>
    </div>

    <div class="welcome" id="welcome" hidden>
      <div class="welcome-mark"><svg viewBox="0 0 24 24"><path d="M12 3v8M6.5 6.5a7 7 0 1 0 11 0"/></svg></div>
      <div class="wordmark">SHADOW<span>VPN</span></div>
      <h1>Приватность без лишнего шума</h1>
      <p>Добавьте HTTPS-ссылку на подписку, чтобы загрузить серверы.</p>
      <input id="welcomeUrl" type="url" inputmode="url" placeholder="https://example.com/subscription">
      <button class="primary" id="welcomeSubmit">Продолжить</button>
      <small id="welcomeError"></small>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
