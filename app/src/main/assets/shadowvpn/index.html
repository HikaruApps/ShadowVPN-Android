<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>ShadowVPN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app" data-state="disconnected">
    <header class="topbar">
      <button class="icon-button" data-panel="settings" aria-label="Настройки">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
      <div class="brand"><img src="logo.png" alt="" width="22" height="22"><span>ShadowVPN</span></div>
      <button class="icon-button" id="menuButton" aria-label="Меню" aria-haspopup="menu" aria-expanded="false">
        <svg class="filled" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
      <div class="popover app-menu" id="appMenu" role="menu" hidden>
        <button data-panel="subscriptions" role="menuitem"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Подписки</span></button>
        <button id="refreshButton" role="menuitem"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/></svg><span>Обновить серверы</span></button>
        <button data-panel="logs" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m8 10 2 2-2 2M13 14h3"/></svg><span>Логи</span></button>
      </div>
    </header>

    <main class="stage">
      <section class="quota" id="subscriptionQuota" hidden>
        <div class="quota-row"><span id="quotaTitle">Трафик подписки</span><b id="quotaValue"></b></div>
        <div class="quota-track"><i id="quotaProgress"></i></div>
        <small id="quotaExpire"></small>
      </section>

      <div class="stage-center">
        <button class="power" id="powerButton" aria-label="Подключить VPN">
          <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.6 6.6a7.5 7.5 0 1 0 10.8 0"/></svg>
        </button>
        <div class="status">
          <h1 id="statusText">Не подключено</h1>
          <p id="statusDetail">Нажмите, чтобы подключиться</p>
        </div>
      </div>

      <section class="stats">
        <div class="stat-grid" id="trafficStats" hidden>
          <div class="stat">
            <span><svg viewBox="0 0 16 16"><path d="M8 3v9M4.5 8.5 8 12l3.5-3.5"/></svg>Загрузка</span>
            <b id="downloadSpeed">0 Б/с</b><small id="downloadTotal">0 Б</small>
          </div>
          <div class="stat">
            <span><svg viewBox="0 0 16 16"><path d="M8 13V4M4.5 7.5 8 4l3.5 3.5"/></svg>Отдача</span>
            <b id="uploadSpeed">0 Б/с</b><small id="uploadTotal">0 Б</small>
          </div>
        </div>
        <div class="ip-pill" id="connectionDetails">
          <i class="dot"></i>
          <span id="ipLabel">IP</span>
          <b id="ipValue">Определяем…</b>
          <i class="divider" id="detailsDivider" hidden></i>
          <b id="sessionTime" hidden>00:00:00</b>
        </div>
      </section>
    </main>

    <section class="dock" id="serverDock">
      <button class="server-picker" id="selectedServerButton" aria-label="Выбрать сервер">
        <span class="server-flag" id="dockFlag"></span>
        <span class="server-copy"><b id="dockName">Выберите сервер</b><small id="dockMeta">Список серверов</small></span>
        <span class="latency" id="dockPing"></span>
        <svg class="chevron" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
      </button>
    </section>

    <div class="scrim" id="serverScrim" hidden></div>
    <section class="sheet server-sheet" id="serverSheet" aria-hidden="true">
      <div class="grabber"></div>
      <header class="sheet-header" id="sheetHeader">
        <div class="sheet-title"><h2>Серверы</h2><p id="serverCount"></p></div>
        <div class="sheet-actions">
          <button class="icon-button" id="sortButton" aria-label="Сортировка" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
          <button class="icon-button" id="pingButton" aria-label="Проверить задержку"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></button>
          <button class="icon-button" id="closeServers" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
      </header>
      <div class="popover sort-menu" id="sortMenu" role="menu" aria-label="Сортировка серверов" hidden>
        <button data-sort="original" role="menuitemradio"><span>Как в подписке</span><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button>
        <button data-sort="name" role="menuitemradio"><span>По названию</span><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button>
        <button data-sort="latency" role="menuitemradio"><span>По задержке</span><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></button>
      </div>
      <div class="chips" id="categories">
        <button class="active" data-category="all">Все</button><button data-category="fast">Быстрые</button><button data-category="p2p">P2P</button><button data-category="gemini">Gemini</button><button data-category="warp">WARP</button><button data-category="no-tls">No TLS</button>
      </div>
      <div class="server-list" id="serverList"></div>
    </section>

    <div class="panel-overlay" id="panelOverlay" hidden>
      <section class="sheet panel" id="panel">
        <div class="grabber"></div>
        <header class="panel-header">
          <button class="icon-button" id="panelBack" aria-label="Назад" hidden><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <h2 id="panelTitle">Настройки</h2>
          <button class="icon-button" id="closePanel" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </header>
        <div class="panel-body" id="panelBody"></div>
      </section>
    </div>

    <div class="welcome" id="welcome" hidden>
      <div class="welcome-body">
        <img class="logo" src="logo.png" alt="" width="64" height="64">
        <h1>ShadowVPN</h1>
        <p>Добавьте ссылку на подписку, чтобы загрузить список серверов.</p>
        <label class="field-label" for="welcomeUrl">Ссылка на подписку</label>
        <input class="field" id="welcomeUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://">
        <small class="field-error" id="welcomeError"></small>
        <button class="button primary" id="welcomeSubmit">Продолжить</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
