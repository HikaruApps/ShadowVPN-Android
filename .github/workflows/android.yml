name: Android build
on:
  push:
  pull_request:
  # Publishing a release on GitHub builds its tag and attaches the APK.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release tag (empty: just build)"
        required: false
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run for a release builds that release's tag.
          # Empty for every other run, which keeps checkout's default commit.
          ref: ${{ github.event.inputs.release_tag || '' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          "$(go env GOPATH)/bin/gomobile" init
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash build-bridge.sh
      - run: cd go && go test ./...
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # Without the secret (forks, first setup) Gradle falls back to a
          # throwaway debug key, and the APK will not install over older builds.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the APK is signed with a one-off debug key"
          fi
      - run: chmod +x gradlew && ./gradlew :app:assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowVPN-Android
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Attach the APK to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          # v0.24.4 and v.0.24.4 both give ShadowVPN-0.24.4.apk.
          version="${TAG#v}"; version="${version#.}"
          cp app/build/outputs/apk/release/app-release.apk "ShadowVPN-$version.apk"
          gh release upload "$TAG" "ShadowVPN-$version.apk" --clobber --repo "$GITHUB_REPOSITORY"
